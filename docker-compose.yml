services:
  app:
    image: lucasmartins1508/restaurante:v1.0.0
    container_name: restaurante-lucas-martins
    ports:
      - "8083:3000"
    environment:
      DB_HOST: dbcentral
      DB_USER: root
      DB_PASS: password
      DB_NAME: marmitadb
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}
  networks:
    rede_alunos:
      external: true